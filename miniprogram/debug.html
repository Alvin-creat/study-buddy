<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debug - StudyBuddy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; padding: 20px; }
    #app { min-height: 100vh; }
    .error { background: #ffe0e0; border: 1px solid red; padding: 12px; margin: 8px 0; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="status">Loading Vue app...</div>

  <script type="module">
    // Add global error handler
    window.onerror = (msg, src, line, col, err) => {
      document.getElementById('status').innerHTML =
        `<div class="error"><b>JS Error:</b> ${msg}<br>at ${src}:${line}:${col}</div>`;
    };

    import { createApp, ref } from '/node_modules/.vite/deps/vue.js?v=b1aca694';
    import { createPinia } from '/node_modules/.vite/deps/pinia.js?v=b1aca694';
    import { createI18n } from '/node_modules/.vite/deps/vue-i18n.js?v=b1aca694';
    import { createRouter, createWebHashHistory } from '/node_modules/.vite/deps/vue-router.js?v=b1aca694';

    try {
      document.getElementById('status').textContent = 'Vue modules loaded, creating app...';

      const i18n = createI18n({
        legacy: false,
        locale: 'en',
        fallbackLocale: 'en',
        messages: { en: { common: { all: 'All' }, auth: { welcome: 'Welcome' } } },
      });

      const Home = { template: '<div style="padding:40px;text-align:center"><h1>🏠 StudyBuddy</h1><p>Debug mode - Vue is working!</p><p><a href="#/test">Go to Test</a></p></div>' };
      const Test = { template: '<div style="padding:40px;text-align:center"><h1>✅ Router works!</h1><p><a href="#/">Go Home</a></p></div>' };

      const router = createRouter({
        history: createWebHashHistory(),
        routes: [
          { path: '/', component: Home },
          { path: '/test', component: Test },
        ],
      });

      const app = createApp({ template: '<router-view />' });
      app.use(createPinia());
      app.use(i18n);
      app.use(router);

      await router.isReady();
      app.mount('#app');

      document.getElementById('status').textContent = '✅ App mounted successfully!';
    } catch (err) {
      document.getElementById('status').innerHTML =
        `<div class="error"><b>App Error:</b> ${err.message}<br><pre>${err.stack}</pre></div>`;
    }
  </script>

  <div id="app"></div>
</body>
</html>
